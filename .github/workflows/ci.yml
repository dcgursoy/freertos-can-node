name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyse, build, test (Ubuntu 24.04, real SocketCAN)
    # Pinned on purpose: ubuntu-latest moves between releases, and the toolchain versions
    # (gcc 13, cppcheck 2.13, clang-tidy 18) are part of what the results depend on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FCN_BUILD_ROOT: ${{ github.workspace }}/build
      FCN_VENV: ${{ github.workspace }}/.venv
      # Every test that runs on both transports must run on SocketCAN here: without vcan0 it
      # fails instead of being skipped, as it is on a laptop that has no vcan module.
      FCN_REQUIRE_SOCKETCAN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # the two pinned submodules; not the kernel's own nested ones

      - name: Scripts are executable in the repository
        # The work tree is edited on Windows, where the file mode cannot be seen; a script
        # committed without its executable bit would only fail here, on Linux.
        # (_common.sh is sourced by the others, never run, and stays non-executable.)
        run: |
          bad="$(git ls-files -s 'scripts/*.sh' | grep -v '/_common\.sh$' | grep -v '^100755' || true)"
          if [ -n "$bad" ]; then echo "not executable in the index:"; echo "$bad"; exit 1; fi

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build can-utils cppcheck clang-tidy clang-format
          uname -r
          gcc --version | head -1
          cmake --version | head -1
          cppcheck --version
          clang-tidy --version | grep version
          python3 --version

      - name: Bring up vcan0 and verify that it carries a frame
        # Real SocketCAN: this step fails the job unless a frame sent with cansend arrives in
        # candump, and the tests below run the node and its transports on this interface.
        # The runner's kernel has vcan built as a module; the script falls back to
        # linux-modules-extra only where an image keeps it there.
        run: scripts/vcan-up.sh --verify --install-modules-extra

      - name: Allow unprivileged user namespaces
        # The tests that delete or take down a vcan interface under the node do it in a user
        # and network namespace of their own (unshare -rn), so that vcan0 is not touched.
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; this lifts the
        # restriction for the job, and the check makes the step fail if it did not take.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn true

      - name: Python environment
        run: scripts/setup-python.sh

      - name: Generated CAN codec is what dbc/fcn.dbc gives
        # app/gen/can_db.[ch] and tests/tools/can_db_table.c are generated by tools/gen_can_db.py
        # and checked in; this fails with a diff if they are stale or the DBC breaks a rule.
        run: scripts/codegen-check.sh

      - name: Static analysis (clang-format, cppcheck, MISRA addon, clang-tidy, self-test)
        run: scripts/static-analysis.sh

      - name: Build debug and release with warnings as errors
        run: scripts/build.sh debug release

      - name: Unit tests and platform self-tests under ASan and UBSan
        run: scripts/test-unit.sh asan

      - name: Unit tests that start threads, under ThreadSanitizer
        # The script switches address-space randomisation off for the test run (setarch -R),
        # which the runtime of gcc 13 needs on kernels with vm.mmap_rnd_bits above 28.
        run: scripts/test-tsan.sh

      - name: Coverage of lib/ (gate on lines and branches)
        run: scripts/coverage.sh

      - name: System tests
        run: scripts/test-system.sh

      - name: Every bug-log entry can be re-created and is still caught
        run: scripts/buglog-verify.sh

      - name: Platform timing on this runner (reported, not gated)
        # A shared runner keeps time poorly; a timing self-test that fails here is recorded
        # in the step's log and does not fail the job. The gated timing tests are in the test
        # steps above, where one that misses its timing tolerance (exit status 75) is repeated
        # once by its own CTest command; any other failure counts at once. The benchmark builds
        # the release preset itself and refuses a binary whose build id (commit plus a hash of
        # the uncommitted changes) is not the checked-out tree's.
        continue-on-error: true
        run: |
          "$FCN_VENV/bin/python" bench/platform_timing.py --seconds 5
          mkdir -p build/runner-results
          cp results/platform_timing.json results/platform_timing.png build/runner-results/

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results
          if-no-files-found: warn
          path: |
            build/asan/test-results/
            build/tsan/test-results/
            build/coverage/coverage/
            build/system-test/
            build/analysis/*.log
            build/buglog-verify/*.log
            build/runner-results/
